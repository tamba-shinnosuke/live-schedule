<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ライブ配信スケジュール</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
    }

    /* ===== TOP PAGE ===== */
    #top-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 40px;
      padding: 40px 20px;
      position: relative;
    }

    #top-page h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.04em; }
    #top-page h1 span { color: #fe2c55; }

    .account-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 600px;
    }

    .account-card { display: flex; flex-direction: column; gap: 8px; }

    .account-btn {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 20px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      width: 100%;
    }

    .account-btn:hover {
      border-color: #fe2c55;
      box-shadow: 0 0 16px rgba(254,44,85,0.3);
      transform: translateY(-2px);
    }

    .account-btn .avatar {
      width: 56px; height: 56px;
      border-radius: 50%; overflow: hidden;
      border: 1px solid #fff;
    }

    .account-btn .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .account-btn .name { font-size: 14px; font-weight: 600; color: #fff; }
    .account-btn .handle { font-size: 12px; color: #666; }

    .tiktok-link {
      display: block; text-align: center;
      font-size: 12px; color: #25f4ee; text-decoration: none;
      padding: 6px; border-radius: 10px;
      background: #111; border: 1px solid #25f4ee;
      transition: all 0.15s;
    }

    .tiktok-link:hover { background: #0a2a2a; }

    /* ===== SCHEDULE PAGE ===== */
    #schedule-page {
      display: none; flex-direction: column;
      position: fixed; inset: 0;
      background: #000; z-index: 10;
    }

    #schedule-view {
      display: flex; flex-direction: column;
      flex: 1; min-height: 0; overflow: hidden;
    }

    .schedule-header {
      background: #111; border-bottom: 1px solid #222;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0; height: 68px;
    }

    .back-btn {
      background: none; border: none; color: #666; cursor: pointer;
      font-size: 22px; padding: 4px 8px; border-radius: 8px;
      transition: color 0.15s; flex-shrink: 0;
    }

    .back-btn:hover { color: #fff; }

    .account-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

    .avatar-sm {
      width: 40px; height: 40px;
      border-radius: 50%; overflow: hidden;
      border: 1px solid #fff; flex-shrink: 0;
    }

    .avatar-sm img { width: 100%; height: 100%; object-fit: cover; }

    .account-name {
      font-size: 14px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .add-btn {
      background: #fe2c55; border: none; color: #fff;
      padding: 8px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 0.15s; flex-shrink: 0;
    }

    .add-btn:hover { background: #e0253c; }

    /* Tabs */
    .tabs {
      display: flex; background: #111; border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1; background: none; border: none;
      border-bottom: 2px solid transparent;
      color: #555; padding: 11px 0;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active { color: #fe2c55; border-bottom-color: #fe2c55; }

    /* Week nav */
    .week-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; padding: 12px 24px;
      background: #111; border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .week-nav-btn {
      background: #222; border: none; color: #fff;
      width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }

    .week-nav-btn:hover { background: #333; }

    .week-label { font-size: 13px; font-weight: 600; min-width: 170px; text-align: center; color: #fff; }

    /* ===== TIMELINE ===== */
    .timeline-container { flex: 1; overflow: auto; min-height: 0; }

    /* Day headers */
    .day-headers {
      display: grid; grid-template-columns: 56px repeat(7, 1fr);
      min-width: 760px;
      position: sticky; top: 0;
      background: #111; border-bottom: 2px solid #222; z-index: 50;
    }

    .day-header-empty {
      border-right: 1px solid #222;
      background: #111;
    }

    .day-header {
      padding: 8px 4px; text-align: center;
      border-right: 1px solid #222;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      background: #111;
    }

    .day-header.today { background: #1a1200; }
    .day-header.sat   { background: #001a1a; }
    .day-header.sun   { background: #1a0008; }

    .day-header .day-name {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #444;
    }

    .day-header.today .day-name { color: #f59e0b; }
    .day-header.sat .day-name   { color: #25f4ee; }
    .day-header.sun .day-name   { color: #fe2c55; }

    /* 全日付を同じサイズの円枠で統一 */
    .day-header .day-num {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; color: #555;
    }

    .day-header.sat .day-num   { color: #25f4ee; }
    .day-header.sun .day-num   { color: #fe2c55; }
    .day-header.today .day-num { background: #f59e0b; color: #000; }

    /* Time grid */
    .time-slots {
      display: grid; grid-template-columns: 56px repeat(7, 1fr);
      min-width: 760px; position: relative;
    }

    .time-col { display: flex; flex-direction: column; }

    .time-label {
      height: 80px;
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 6px;
      font-size: 11px; font-weight: 700; color: #333;
      border-right: 1px solid #1a1a1a;
      border-bottom: 1px solid #1a1a1a;
      letter-spacing: 0.03em;
      background: #0a0a0a;
    }

    .time-label.major { color: #555; font-size: 12px; }

    .day-col { position: relative; border-right: 1px solid #1a1a1a; background: #0a0a0a; overflow: hidden; }
    .day-col.today-col { background: #0d0a00; }
    .day-col.sat-col   { background: #00100f; }
    .day-col.sun-col   { background: #100004; }

    .hour-cell {
      height: 80px;
      border-bottom: 1px solid #1a1a1a;
    }

    .hour-cell.major { border-bottom-color: #2a2a2a; }

    .hour-cell::after {
      content: ''; display: block; height: 50%;
      border-bottom: 1px dashed #161616;
    }

    /* Current time indicator */
    .now-line {
      position: absolute; left: 0; right: 0; height: 2px;
      background: #f59e0b; z-index: 30; pointer-events: none;
    }

    .now-line::before {
      content: ''; position: absolute;
      left: -4px; top: -4px;
      width: 10px; height: 10px;
      background: #f59e0b; border-radius: 50%;
    }

    /* ===== EVENT BLOCKS ===== */
    .event-block {
      position: absolute; left: 2px; right: 2px;
      border-radius: 5px;
      padding: 5px 7px;
      cursor: pointer; z-index: 10; overflow: hidden;
      transition: filter 0.15s, box-shadow 0.15s, z-index 0s;
      display: flex; flex-direction: column; gap: 2px;
      background: #1a1a1a !important; color: #fff !important;
      border-left: 3px solid #fe2c55;
      box-shadow: 0 1px 6px rgba(254,44,85,0.2);
    }

    .event-block:hover {
      filter: brightness(1.3);
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
      z-index: 20;
    }

    .event-time-label {
      font-size: 9px; font-weight: 700; opacity: 0.75;
      letter-spacing: 0.02em;
    }

    .event-title {
      font-size: 11px; font-weight: 800;
      line-height: 1.2; margin-top: 1px;
    }

    .event-members {
      display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px;
    }

    .event-member-chip {
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,0.28);
      border-radius: 20px; padding: 3px 8px 3px 4px;
      font-size: 10px; font-weight: 700; white-space: nowrap;
    }

    .event-member-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; overflow: hidden; flex-shrink: 0;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.3);
    }

    .event-member-icon img { width: 100%; height: 100%; object-fit: cover; }

    /* モデレーターはテキストのみ */
    .event-mod-label {
      font-size: 9px; font-weight: 600; opacity: 0.75;
      background: rgba(0,0,0,0.25);
      border-radius: 4px; padding: 1px 5px;
      white-space: nowrap;
    }

    /* ===== STREAMER VIEW ===== */
    #streamer-view { display: none; padding: 20px; flex: 1; overflow-y: auto; min-height: 0; }

    .streamer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 14px;
    }

    .streamer-card {
      background: #111; border: 1px solid #2a2a2a; border-radius: 16px;
      padding: 18px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      cursor: pointer; transition: border-color 0.15s;
    }

    .streamer-card:hover { border-color: #fe2c55; }

    .streamer-icon {
      width: 58px; height: 58px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; overflow: hidden;
    }

    .streamer-icon img { width: 100%; height: 100%; object-fit: cover; }
    .streamer-card .streamer-name { font-size: 12px; font-weight: 600; text-align: center; color: #fff; }

    .streamer-add-card {
      border: 2px dashed #2a2a2a; border-radius: 16px; padding: 18px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      cursor: pointer; transition: border-color 0.15s; color: #444;
    }

    .streamer-add-card:hover { border-color: #fe2c55; color: #fe2c55; }

    .streamer-add-icon {
      width: 58px; height: 58px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; background: #1a1a1a;
    }

    /* ===== MODALS ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 200;
      align-items: center; justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #111; border: 1px solid #2a2a2a; border-radius: 20px;
      padding: 22px; width: 100%; max-width: 430px; margin: 16px;
      max-height: 92vh; overflow-y: auto;
    }

    .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; color: #fff; }

    .form-group { margin-bottom: 13px; }

    .form-group label {
      display: block; font-size: 11px; color: #555;
      margin-bottom: 5px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%; background: #0a0a0a;
      border: 1px solid #2a2a2a; border-radius: 10px;
      color: #fff; padding: 9px 12px; font-size: 14px;
      outline: none; transition: border-color 0.15s;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: #fe2c55; }

    .form-group textarea { height: 70px; resize: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Streamer selector */
    .streamer-selector {
      display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 0;
      min-height: 36px;
    }

    .streamer-chip {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; opacity: 0.4; transition: opacity 0.15s;
    }

    .streamer-chip.selected { opacity: 1; }

    .streamer-chip-icon {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; overflow: hidden;
      border: 2px solid transparent; transition: border-color 0.15s;
    }

    .streamer-chip.selected .streamer-chip-icon { border-color: #fff; }
    .streamer-chip-icon img { width: 100%; height: 100%; object-fit: cover; }

    .streamer-chip-name {
      font-size: 10px; color: #555; text-align: center;
      max-width: 46px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    .streamer-chip.selected .streamer-chip-name { color: #fff; }

    .no-streamers-hint { font-size: 12px; color: #444; padding: 6px 0; }

    /* Color picker */
    .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }

    .color-option {
      width: 26px; height: 26px; border-radius: 50%;
      cursor: pointer; border: 3px solid transparent;
      transition: border-color 0.15s;
    }

    .color-option.selected { border-color: #fff; }

    /* Modal actions */
    .modal-actions { display: flex; gap: 8px; margin-top: 18px; }

    .btn-cancel {
      flex: 1; background: #222; border: none; color: #888;
      padding: 11px; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }

    .btn-cancel:hover { background: #333; }

    .btn-save {
      flex: 2; background: #fe2c55; border: none; color: #fff;
      padding: 11px; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }

    .btn-save:hover { background: #e0253c; }

    .btn-delete {
      background: #222; border: none; color: #fe2c55;
      padding: 11px 14px; border-radius: 12px;
      font-size: 14px; cursor: pointer; transition: background 0.15s;
    }

    .btn-delete:hover { background: #2a0a10; }

    /* Icon type toggle */
    .icon-type-toggle {
      display: flex; background: #0a0a0a; border-radius: 10px;
      padding: 3px; margin-bottom: 10px;
    }

    .icon-type-btn {
      flex: 1; background: none; border: none; color: #444;
      padding: 7px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }

    .icon-type-btn.active { background: #222; color: #fff; }

    /* Emoji grid */
    .emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; }

    .emoji-option {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; border-radius: 8px; cursor: pointer;
      background: #0a0a0a; border: 2px solid transparent;
      transition: border-color 0.15s;
    }

    .emoji-option.selected { border-color: #fe2c55; }
    .emoji-option:hover { border-color: #333; }

    /* Image upload */
    .image-upload-area {
      border: 2px dashed #2a2a2a; border-radius: 12px;
      padding: 20px; text-align: center; cursor: pointer;
      transition: border-color 0.15s;
    }

    .image-upload-area:hover { border-color: #fe2c55; }

    .image-preview {
      width: 60px; height: 60px; border-radius: 50%;
      overflow: hidden; margin: 0 auto 8px;
    }

    .image-preview img { width: 100%; height: 100%; object-fit: cover; }
    #sf-image-file { display: none; }

    /* ===== MOBILE ===== */
    @media (max-width: 640px) {
      /* ヘッダー */
      .schedule-header { padding: 10px 12px; height: 54px; gap: 8px; }
      .avatar-sm { width: 34px; height: 34px; }
      .account-name { font-size: 13px; }
      .add-btn { padding: 7px 12px; font-size: 12px; }

      /* タブ */
      .tab-btn { font-size: 12px; padding: 9px 0; }

      /* 週ナビ */
      .week-nav { padding: 8px 12px; }
      .week-label { font-size: 11px; min-width: 130px; }
      .week-nav-btn { width: 26px; height: 26px; font-size: 14px; }

      /* タイムライングリッド: 固定幅カラム */
      .day-headers,
      .time-slots {
        grid-template-columns: 44px repeat(7, 130px);
        min-width: unset;
      }

      /* 時間ラベル */
      .time-label { font-size: 10px; font-weight: 800; }

      /* 曜日ヘッダー */
      .day-header { padding: 8px 4px 6px; }
      .day-header .day-name { font-size: 10px; }
      .day-header .day-num { font-size: 20px; }
      .day-header.today .day-num { width: 30px; height: 30px; font-size: 16px; }

      /* イベントブロック */
      .event-time-label { font-size: 10px; }
      .event-title { font-size: 12px; font-weight: 800; }
      .event-member-chip { font-size: 11px; gap: 6px; padding: 3px 8px 3px 4px; }
      .event-member-icon { width: 38px; height: 38px; font-size: 22px; border-width: 2px; }
      .event-mod-label { font-size: 10px; padding: 2px 6px; }
      .event-members { gap: 5px; margin-top: 5px; }

      /* モーダル: ボトムシート */
      .modal-overlay { align-items: flex-end; }
      .modal {
        margin: 0;
        border-radius: 20px 20px 0 0;
        max-height: 88vh;
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }

      /* トップページ */
      .account-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 100%; }
      .account-btn { padding: 20px 12px; }
      .account-btn .avatar { width: 64px; height: 64px; }
      .account-btn .name { font-size: 13px; }

      /* 配信者グリッド */
      .streamer-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
    }

    /* Member sections */
    .member-section { margin-bottom: 28px; }

    .member-section-header {
      font-size: 13px; font-weight: 700; color: #555;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid #222;
    }

    /* ===== お得情報ボタン ===== */
    #deals-fab {
      position: absolute; top: 20px; right: 20px;
      background: linear-gradient(135deg, #fe2c55 0%, #ff4d00 50%, #f59e0b 100%);
      border: none; border-radius: 20px;
      padding: 16px 18px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      box-shadow: 0 0 40px rgba(254,44,85,0.5), 0 8px 32px rgba(0,0,0,0.4);
      animation: dealsFabPulse 2s ease-in-out infinite;
      transition: transform 0.15s;
      overflow: hidden; min-width: 90px;
    }

    #deals-fab::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.12) 50%, transparent 100%);
      animation: dealsShimmer 2.5s ease-in-out infinite;
    }

    @keyframes dealsShimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    #deals-fab:hover { transform: scale(1.02); }
    #deals-fab:active { transform: scale(0.98); }

    @keyframes dealsFabPulse {
      0%,100% { box-shadow: 0 0 40px rgba(254,44,85,0.5), 0 8px 32px rgba(0,0,0,0.4); }
      50%      { box-shadow: 0 0 60px rgba(254,44,85,0.8), 0 8px 40px rgba(0,0,0,0.5); }
    }

    .deals-fab-emoji { font-size: 34px; line-height: 1; }
    .deals-fab-label {
      font-size: 13px; font-weight: 900; color: #fff;
      letter-spacing: 0.02em; line-height: 1;
    }
    .deals-fab-sub {
      font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.75);
      text-align: center;
    }

    .deals-fab-badge {
      position: absolute; top: -8px; right: -8px;
      background: #25f4ee; color: #000;
      font-size: 12px; font-weight: 900;
      min-width: 22px; height: 22px; border-radius: 11px;
      padding: 0 6px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ===== お得情報ページ ===== */
    #deals-page {
      display: none; flex-direction: column;
      position: fixed; inset: 0;
      background: #000; z-index: 10;
    }

    .deals-page-header {
      background: #111; border-bottom: 1px solid #222;
      padding: 14px 18px; height: 68px;
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }

    .deals-page-header h2 { flex: 1; font-size: 17px; font-weight: 800; color: #fff; }

    .deals-page-body {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .deal-card {
      background: #111; border: 1px solid #2a2a2a;
      border-radius: 16px; padding: 18px;
      position: relative;
    }

    .deal-card-title {
      font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 8px;
    }

    .deal-card-content {
      font-size: 14px; color: #aaa; line-height: 1.7; white-space: pre-wrap;
    }

    .deal-card-actions {
      position: absolute; top: 12px; right: 12px;
      display: none; gap: 6px;
    }

    .deal-card-edit {
      background: none; border: 1px solid #333; color: #888;
      font-size: 11px; padding: 3px 8px; border-radius: 6px;
      cursor: pointer; transition: all 0.15s;
    }

  // ===== INIT =====
  function init() {
    initMode();
    deduplicateMembersIfNeeded();
    importToriScheduleIfNeeded();
    document.getElementById('account-grid').innerHTML = ACCOUNTS.map(a => `
      <div class="account-card">
        <button class="account-btn" onclick="selectAccount('${a.id}')">
          <div class="avatar"><img src="${a.img}" alt="${a.name}"></div>
          <div class="name">${a.name}</div>
        </button>
        <a class="tiktok-link" href="${a.url}" target="_blank" onclick="event.stopPropagation()">TikTokを開く →</a>
      </div>
    `).join('');
  }

  // ===== NAVIGATION =====
  function selectAccount(id) {
    currentAccount = ACCOUNTS.find(a => a.id === id);
    document.getElementById('top-page').style.display = 'none';
    document.getElementById('schedule-page').style.display = 'flex';

    document.getElementById('header-avatar').innerHTML =
      `<img src="${currentAccount.img}" alt="${currentAccount.name}">`;
    document.getElementById('header-name').innerHTML =
      `${currentAccount.name} <a href="${currentAccount.url}" target="_blank" style="font-size:11px;color:#fe2c55;text-decoration:none;margin-left:6px">TikTok ↗</a>`;

    currentWeekStart = getWeekStart(new Date());
    switchTab('schedule');
    updateGoLiveBtn();
  }

  function goBack() {
    document.getElementById('schedule-page').style.display = 'none';
    document.getElementById('top-page').style.display = 'flex';
    document.getElementById('go-live-btn').classList.remove('visible', 'live');
  }

  // ===== TABS =====
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-schedule').classList.toggle('active', tab === 'schedule');
    document.getElementById('tab-streamer').classList.toggle('active', tab === 'streamer');

    const addBtn = document.getElementById('header-add-btn');

    if (tab === 'schedule') {
      document.getElementById('schedule-view').style.display = 'flex';
      document.getElementById('streamer-view').style.display = 'none';
      addBtn.textContent = '+ 追加';
      addBtn.style.display = isAdminMode ? '' : 'none';
      addBtn.onclick = () => openEventModal();
      renderTimeline();
      scrollToCurrentTime();
    } else {
      document.getElementById('schedule-view').style.display = 'none';
      document.getElementById('streamer-view').style.display = 'block';
      addBtn.style.display = 'none';
      renderStreamerGrid();
      renderModeratorGrid();
    }
  }

  // ===== WEEK NAV =====
  function changeWeek(dir) {
    const d = new Date(currentWeekStart);
    d.setDate(d.getDate() + dir * 7);
    currentWeekStart = d;
    renderTimeline();
  }

  // ===== TIMELINE =====
  function getWeekStart(date) {
    const d = new Date(date);
    const day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function scrollToCurrentTime() {
    requestAnimationFrame(() => {
      const container = document.querySelector('.timeline-container');
      if (!container) return;

      // 縦: 現在時刻の1時間前
      const h = new Date().getHours();
      container.scrollTop = Math.max(0, (h - 1) * HOUR_H);

      // 横: 今日の列を左端付近に表示（モバイル向け）
      const today = new Date(); today.setHours(0,0,0,0);
      const days = Array.from({length: 7}, (_, i) => {
        const d = new Date(currentWeekStart);
        d.setDate(d.getDate() + i);
        d.setHours(0,0,0,0);
        return d;
      });
      const todayIdx = days.findIndex(d => d.getTime() === today.getTime());
      if (todayIdx >= 0) {
        const isMobile = window.innerWidth <= 640;
        const colW = isMobile ? 130 : container.scrollWidth / 8;
        const timeW = isMobile ? 44 : 56;
        // 今日の列が左から1列目に来るようにスクロール
        container.scrollLeft = Math.max(0, todayIdx * colW - timeW);
      }
    });
  }

  const HOUR_H = 80; // 1時間あたりのピクセル高さ

  function renderTimeline() {
    const days = Array.from({length: 7}, (_, i) => {
      const d = new Date(currentWeekStart);
      d.setDate(d.getDate() + i);
      return d;
    });

    const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
    document.getElementById('week-label').textContent =
      `${fmt(days[0])} (月) 〜 ${fmt(days[6])} (日)`;

    const DAY_NAMES = ['月','火','水','木','金','土','日'];
    const today = new Date(); today.setHours(0,0,0,0);

    document.getElementById('day-headers').innerHTML =
      '<div class="day-header-empty"></div>' +
      days.map((d, i) => {
        const isToday = d.getTime() === today.getTime();
        const isSat = i === 5, isSun = i === 6;
        const cls = [isToday ? 'today' : '', isSat ? 'sat' : '', isSun ? 'sun' : ''].filter(Boolean).join(' ');
        return `<div class="day-header${cls ? ' ' + cls : ''}">
          <div class="day-name">${DAY_NAMES[i]}</div>
          <div class="day-num">${d.getDate()}</div>
        </div>`;
      }).join('');

    const hours = Array.from({length: 24}, (_, i) => i);
    const events = scheduleData[currentAccount.id] || [];
    const MAJOR = new Set([0, 6, 12, 18]);

    // 時間ラベル列
    let html = '<div class="time-col">' +
      hours.map(h => `<div class="time-label${MAJOR.has(h) ? ' major' : ''}">${String(h).padStart(2,'0')}:00</div>`).join('') +
      '</div>';

    // 各曜日列
    days.forEach((d, i) => {
      const isToday = d.getTime() === today.getTime();
      const isSat = i === 5, isSun = i === 6;
      const colCls = [isToday ? 'today-col' : '', isSat ? 'sat-col' : '', isSun ? 'sun-col' : ''].filter(Boolean).join(' ');
      const dayEvents = events.filter(e => e.date === dateToStr(d));
      const cells = hours.map(h => `<div class="hour-cell${MAJOR.has(h) ? ' major' : ''}"></div>`).join('');
      const evBlocks = dayEvents.map(ev => buildEventBlock(ev)).join('');
      const nowLine = isToday ? buildNowLine() : '';

      html += `<div class="day-col${colCls ? ' ' + colCls : ''}">
        ${cells}
        <div style="position:absolute;inset:0;pointer-events:none">${evBlocks}${nowLine}</div>
      </div>`;
    });

    document.getElementById('time-slots').innerHTML = html;
    document.querySelectorAll('.event-block').forEach(el => { el.style.pointerEvents = 'auto'; });

    // 現在時刻ラインを毎分更新
    clearInterval(window._nowLineTimer);
    window._nowLineTimer = setInterval(() => {
      document.querySelectorAll('.now-line').forEach(el => {
        el.style.top = getNowTop() + 'px';
      });
    }, 60000);
  }

  function getNowTop() {
    const now = new Date();
    return (now.getHours() + now.getMinutes() / 60) * HOUR_H;
  }

  function buildNowLine() {
    return `<div class="now-line" style="top:${getNowTop()}px"></div>`;
  }

  function buildEventBlock(ev) {
    const [sh, sm] = ev.start.split(':').map(Number);
    const [eh, em] = ev.end.split(':').map(Number);
    const top    = (sh + sm / 60) * HOUR_H;
    const height = Math.max(((eh + em / 60) - (sh + sm / 60)) * HOUR_H, 30);

    const streamers  = (ev.streamerIds  || []).map(id => streamersData.find(s => s.id === id)).filter(Boolean);
    const moderators = (ev.moderatorIds || []).map(id => moderatorsData.find(s => s.id === id)).filter(Boolean);

    // ブロックカラーは統一（イベント色）
    const bg = ev.color || '#fe2c55';
    const fg = isLightColor(bg) ? '#111' : '#fff';

    // 配信者: 大きいアイコン + 名前
    const streamerChip = s => {
      const icon = s.iconType === 'image' && s.imgData
        ? `<img src="${s.imgData}" alt="${escHtml(s.name)}">`
        : s.emoji;
      return `<div class="event-member-chip">
        <div class="event-member-icon">${icon}</div>
        ${escHtml(s.name)}
      </div>`;
    };

    // モデレーター: テキストのみ
    const modLabel = s =>
      `<span class="event-mod-label">🛡 ${escHtml(s.name)}</span>`;

    const membersHTML = (streamers.length || moderators.length)
      ? `<div class="event-members">
           ${streamers.map(streamerChip).join('')}
           ${moderators.map(modLabel).join('')}
         </div>`
      : '';

    // ブロック高さが小さいときはコンパクト表示
    const compact = height < 72;

    return `<div class="event-block"
      style="top:${top}px;height:${height}px;background:${bg};color:${fg}"
      onclick="if(isAdminMode) openEventModal('${ev.id}')">
      ${compact
        ? `<div class="event-title" style="font-size:9px">${escHtml(ev.title)}</div>`
        : `<div class="event-time-label">${ev.start}〜${ev.end}</div>
           <div class="event-title">${escHtml(ev.title)}</div>
           ${membersHTML}`
      }
    </div>`;
  }

  function isLightColor(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return (r*299 + g*587 + b*114) / 1000 > 128;

  // ===== サーバー同期 =====
  const SYNC_API   = 'http://localhost:8765/api/schedule';
  const EV_PREFIXES = { account1:'ev_tori_', account2:'ev_seikai_', account3:'ev_lumina_' };
  let lastSyncHash = null;

  function setSyncBadge(state, text) {
    const badge = document.getElementById('sync-badge');
    const dot   = document.getElementById('sync-dot');
    const label = document.getElementById('sync-label');
    badge.classList.add('visible');
    dot.className = 'sync-dot' + (state === 'ok' ? '' : state === 'error' ? ' error' : ' syncing');
    label.textContent = text;
  }

  function applyServerData(data) {
    if (!data || data.error) return false;

    // メンバーはサーバーリストで完全置換（古いデータを残さない）
    const serverMembers = data.members || [];
    localStorage.setItem('streamers', JSON.stringify(serverMembers));
    streamersData  = serverMembers;
    moderatorsData = streamersData;

    // 各アカウントのイベントを更新（手動追加イベントは保持）
    const schedule = JSON.parse(localStorage.getItem('liveSchedule') || '{}');
    for (const [accountId, prefix] of Object.entries(EV_PREFIXES)) {
      const imported = (data.accounts?.[accountId] || []);
      const manual   = (schedule[accountId] || []).filter(e => !e.id.startsWith(prefix));
      schedule[accountId] = [...imported, ...manual];
    }
    localStorage.setItem('liveSchedule', JSON.stringify(schedule));
    scheduleData = schedule;

    // 表示中のアカウントを再描画
    if (currentAccount && currentTab === 'schedule') renderTimeline();
    return true;
  }

  async function syncFromServer() {
    setSyncBadge('syncing', '同期中...');
    try {
      const res = await fetch(SYNC_API, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const hash = data.updatedAt + '';
      if (hash !== lastSyncHash) {
        applyServerData(data);
        lastSyncHash = hash;
        const now = new Date();
        const t   = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
        setSyncBadge('ok', `✓ 同期済 ${t}`);
      } else {
        setSyncBadge('ok', '✓ 最新');
      }
    } catch (e) {
      setSyncBadge('error', 'サーバー未起動');
    }
  }

  // 初回 + 30秒ごとに同期

  // ===== GO LIVE (スケジュール自動検知) =====

  // 現在時刻がスケジュールの配信時間内か判定
  function getCurrentLiveEvent(accountId) {
    if (!accountId) return null;
    const now = new Date();
    const todayStr = dateToStr(now);
    const nowMin = now.getHours() * 60 + now.getMinutes();
    return (scheduleData[accountId] || []).find(ev => {
      if (ev.date !== todayStr) return false;
      const [sh, sm] = ev.start.split(':').map(Number);
      const [eh, em] = ev.end.split(':').map(Number);
      return nowMin >= sh * 60 + sm && nowMin < eh * 60 + em;
    }) || null;
  }

  function updateGoLiveBtn() {
    const btn = document.getElementById('go-live-btn');
    if (!currentAccount) { btn.classList.remove('visible'); return; }

    btn.classList.add('visible');
    const liveEvent = getCurrentLiveEvent(currentAccount.id);
    if (liveEvent) {
      btn.classList.add('live');
      btn.innerHTML = '<div class="live-dot"></div> LIVE';
      btn.style.color = '#fff';
    } else {
      btn.classList.remove('live');
      btn.innerHTML = 'VIEW ACCOUNT';
      btn.style.color = '#f59e0b';
    }
  }

  function onGoLiveClick() {
    if (!currentAccount) return;
    const liveEvent = getCurrentLiveEvent(currentAccount.id);
    if (liveEvent) {

  async function saveDeals() {
    const pin     = sessionStorage.getItem('adminPin') || '';
    const title   = document.getElementById('deals-title-input').value.trim();
    const content = document.getElementById('deals-content-input').value.trim();
    if (!selectedDealAccount) { alert('アカウントを選択してください'); return; }
    if (!title) { alert('タイトルを入力してください'); return; }
    const account = selectedDealAccount;
    const action  = editingDealId ? 'update' : 'add';
    const body2   = {pin, action, title, content, account};
    if (editingDealId) body2.id = editingDealId;
    try {
      const res = await fetch('/api/deals', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body2)
      });
      const data = await res.json();
      if (data.ok) {
        await fetchDeals();
        renderDealsPage();
        closeDealsModal();
      } else { alert('認証エラー'); }
    } catch { alert('保存に失敗しました'); }
  }

  async function deleteDeal(id) {
    if (!confirm('この情報を削除しますか？')) return;
    const pin = sessionStorage.getItem('adminPin') || '';
    try {
      const res = await fetch('/api/deals', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pin, action: 'delete', id})
      });
      const data = await res.json();
      if (data.ok) { await fetchDeals(); renderDealsPage(); }
    } catch {}
  }

  document.getElementById('deals-modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeDealsModal();
  });

  // 初回ロード
  fetchDeals();
  setInterval(fetchDeals, 60000);

  init();
</script>
</body>
</html>
